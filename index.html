<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>HLF20 Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: white; font-family: sans-serif; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 8px 16px;
      border-radius: 20px; pointer-events: none;
    }
    #panel {
      display: none;
      position: fixed; right: 20px; top: 50%;
      transform: translateY(-50%);
      background: rgba(20,20,20,0.95);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 24px;
      color: white;
      font-family: sans-serif;
      width: 280px;
    }
    #panel h2 { font-size: 18px; margin-bottom: 12px; color: #ff9900; }
    #panel p { font-size: 14px; color: #ccc; line-height: 1.6; }
    #panel button {
      margin-top: 16px;
      padding: 8px 16px;
      background: #ff9900;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      display: block;
      width: 100%;
    }
    #panel button:hover { background: #cc7700; }
  </style>
</head>
<body>
  <div id="info">🖱️ Linke Maustaste: Drehen | Mausrad: Zoom | Rechte Maustaste: Verschieben</div>

  <div id="panel">
    <h2 id="panel-title">Gerät</h2>
    <p id="panel-desc">Beschreibung</p>
    <button id="close-btn" onclick="document.getElementById('panel').style.display='none'">✕ Schließen</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script>
    // currentPdf muss global sein, damit der onclick-Button im HTML drauf zugreifen kann
    let currentPdf = '';
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.01, 1000
    );
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Hotspot-Daten
    const hotspots = [
      {
        position: new THREE.Vector3(-0.004, -0.045, -0.003),
        title: 'Glühbirne',
        desc: 'Hier stehen Infos zur Glühbirne. Baujahr, Material, Kennzahlen etc.',
        pdf: [
          { label: '📄 Bedienungsanleitung', file: 'lampe-bedienungsanleitung.pdf' },
          { label: '📄 Fakten Glühbirne', file: 'glühbirne.pdf' }
        ]
      },
      {
        position: new THREE.Vector3(-0.008, 0.102, 0.023),
        title: 'Lampenschirm',
        desc: 'Hier stehen Infos zum Lampenschirm. Baujahr, Material, Kennzahlen etc.',
        pdf: [
          { label: '📄 Bedienungsanleitung', file: 'lampe-bedienungsanleitung.pdf' }
        ]
      },
      {
        position: new THREE.Vector3(-0.024, -0.167, 0.063),
        title: 'Lampenfuß',
        desc: 'Hier stehen Infos zum Lampenfuß. Baujahr, Material, Kennzahlen etc.',
        pdf: [
          { label: '📄 Bedienungsanleitung', file: 'lampe-bedienungsanleitung.pdf' }
        ]
      },
    ];

    // Hotspot-Kugeln erstellen
    const hotspotMeshes = [];
    hotspots.forEach((h) => {
      const geo = new THREE.SphereGeometry(0.015, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff9900 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(h.position);
      mesh.userData = h;
      scene.add(mesh);
      hotspotMeshes.push(mesh);
    });

    // GLB laden
    const loader = new GLTFLoader();
    loader.load('./lampe.glb', (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, maxDim * 0.5, maxDim * 2);
      controls.update();
      scene.add(model);
    });

    // Klick-Erkennung
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(hotspotMeshes);
      if (hits.length > 0) {
        const h = hits[0].object.userData;
        document.getElementById('panel-title').textContent = h.title;
        document.getElementById('panel-desc').textContent = h.desc;

        const oldBtns = document.querySelectorAll('.pdf-btn');
        oldBtns.forEach(b => b.remove());

        const panel = document.getElementById('panel');
        const closeBtn = document.getElementById('close-btn');
        if (h.pdf && Array.isArray(h.pdf) && h.pdf.length > 0) {
          h.pdf.forEach(pdf => {
            const btn = document.createElement('button');
            btn.className = 'pdf-btn';
            btn.textContent = pdf.label;
            btn.onclick = () => window.open(pdf.file, '_blank');
            panel.insertBefore(btn, closeBtn);
          });
        }

        document.getElementById('panel').style.display = 'block';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
